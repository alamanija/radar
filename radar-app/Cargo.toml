[package]
name = "radar-app"
version.workspace = true
edition.workspace = true
rust-version = "1.99"
license.workspace = true
publish.workspace = true
description = "Radar desktop app (GPUI Kit)"

# Earlier releases' binary was `radar` too: login items, the Windows install
# and older builds' updater relaunch all name `.../radar(.exe)`.
[[bin]]
name = "radar"
path = "src/main.rs"

[dependencies]
radar-core = { path = "../radar-core" }
gpui-kit = "0.9.0"
anyhow = "1"
async-channel = "2"
auto-launch = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
flexi_logger = "0.29"
futures = "0.3"
interprocess = { version = "2.4", features = ["tokio"] }
log = "0.4"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "time", "rt", "sync", "macros"] }
tray-icon = "0.26"
url = "2"
cargo-packager-updater = { version = "0.2.3", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
base64 = "0.22"
gpui-kit = { version = "0.9.0", features = ["test-support"] }
httpmock = "0.9.0"
tempfile = "3"
tokio = { version = "1", features = ["time"] }

# The AppIndicator tray needs a GTK main loop on its own thread.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
widestring = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Packaged by `cargo packager -p radar-app --release` (CI: release.yml).
# Signing reads CARGO_PACKAGER_SIGN_PRIVATE_KEY and
# CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD from the environment. The version
# comes from `[workspace.package]` in the root Cargo.toml.
[package.metadata.packager]
product-name = "Radar"
identifier = "com.radar.dev"
before-packaging-command = "cargo build --release -p radar-app"
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/128x128@2x.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]

[package.metadata.packager.macos]
# Ad-hoc signature over the whole bundle (Info.plist and resources sealed).
# Without it only the linker's signature on the executable exists, and
# Gatekeeper reports a downloaded copy as "damaged" with no way to open it.
# Ad-hoc is not notarized: the first launch still needs System Settings >
# Privacy & Security > Open Anyway. Replace with a Developer ID identity to
# notarize.
signing-identity = "-"

[package.metadata.packager.nsis]
# Same per-user install earlier releases used.
installer-mode = "currentUser"
