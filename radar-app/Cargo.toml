[package]
name = "radar-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Radar desktop app (GPUI Kit)"

[[bin]]
name = "radar-app"
path = "src/main.rs"

[dependencies]
radar-core = { path = "../radar-core" }
gpui-kit = "0.9.0"
anyhow = "1"
dirs = "5"
flexi_logger = "0.29"
futures = "0.3"
interprocess = { version = "2.4", features = ["tokio"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "time", "rt"] }

[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["test-support"] }
httpmock = "0.9.0"
tempfile = "3"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
widestring = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
