# Signed release workflow (cargo-packager).
#
# Trigger: push a tag matching `v*.*.*`. Cut one with:
#     cargo set-version --bump patch   # cargo-edit; edits [workspace.package] in the root Cargo.toml
#     git commit -am "chore: release vX.Y.Z" && git tag vX.Y.Z
#     git push && git push --tags
# Output: a GitHub Release with the per-platform installers, their `.sig`
# files, and a `latest.json` manifest (scripts/make-latest-json.sh) that both
# the installed Tauri builds and this app's cargo-packager-updater read.
#
# Platform matrix: Apple Silicon macOS (app + dmg) and Windows x86_64 (nsis).
# Intel macOS and Linux are intentionally not built; there is no updater
# entry for them, so those installs stop receiving updates.
#
# Repository secrets (Settings > Secrets and variables > Actions). They are the
# existing Tauri minisign key; cargo-packager reads the same key format:
#   TAURI_SIGNING_PRIVATE_KEY          - contents of ~/.tauri/radar.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - the password chosen at generate time
# Repository variables (same page, "Variables" tab; public values, baked into
# the binary at compile time):
#   RADAR_CLERK_FRONTEND_API - Clerk Frontend API URL (https://<instance>.clerk...)
#   RADAR_CLERK_CLIENT_ID    - the Clerk OAuth application's client id
# macOS builds are unsigned/not notarized until Apple Developer secrets are
# added (Gatekeeper warns on first launch: right-click > Open).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Creates the draft once, so the matrix jobs only upload to it.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A tag that disagrees with the crate version would ship a build that
      # offers itself as an update forever.
      - name: Check tag matches the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG != Cargo.toml version v$version" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --title "Radar $TAG" \
            --notes "See the assets below to download."

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            formats: app,dmg
          - platform: windows-latest
            formats: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # radar-app declares rust-version 1.99 (gpui-pre needs it).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package and sign
        env:
          # Compile-time client config (read with option_env! in radar-core).
          # Public values; the first came from the old .env.production.
          RADAR_SERVER_URL: https://radar-server-kjsc.onrender.com
          RADAR_CLERK_FRONTEND_API: ${{ vars.RADAR_CLERK_FRONTEND_API }}
          RADAR_CLERK_CLIENT_ID: ${{ vars.RADAR_CLERK_CLIENT_ID }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo packager -p radar-app --release --formats ${{ matrix.formats }}

      # Everything the packager wrote for this release: installers, the
      # `.app.tar.gz` updater archive, and the `.sig` files.
      - name: Upload artifacts to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(target/release/*-setup.exe target/release/*.dmg target/release/*.app.tar.gz target/release/*.sig)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "packager produced no artifacts" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # After every matrix job has uploaded: build `latest.json` from the signed
  # artifacts and flip the draft to published, so the updater-facing
  # `releases/latest/download/latest.json` URL resolves.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir artifacts
          gh release download "$TAG" --dir artifacts --pattern '*-setup.exe*' --pattern '*.app.tar.gz*'
          scripts/make-latest-json.sh "${TAG#v}" "$REPO" artifacts > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            });
            const draft = releases.find(r => r.tag_name === context.ref.replace('refs/tags/', ''));
            if (!draft) {
              core.setFailed(`no draft release found for ${context.ref}`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draft.id,
              draft: false,
            });
            core.info(`published release ${draft.tag_name}`);
