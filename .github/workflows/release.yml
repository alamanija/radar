# Signed release workflow (cargo-packager).
#
# Trigger: push a tag matching `v*.*.*`. Cut one with:
#     cargo set-version --bump patch   # cargo-edit; edits [workspace.package] in the root Cargo.toml
#     git commit -am "chore: release vX.Y.Z" && git tag vX.Y.Z
#     git push && git push --tags
# Output: a GitHub Release with the per-platform installers, their `.sig`
# files, and a `latest.json` manifest (scripts/make-latest-json.sh) that the
# app's updater reads, including in already-installed older builds.
#
# Dry run: start the workflow by hand (Actions > Release > Run workflow) on a
# branch. It checks the configuration, then builds, packages and signs both
# platforms and attaches the outputs to the run as workflow artifacts. It
# creates and publishes no release. Run by hand on a tag, it releases.
#
# Platform matrix: Apple Silicon macOS (app + dmg) and Windows x86_64 (nsis).
# Intel macOS and Linux are intentionally not built; there is no updater
# entry for them, so those installs stop receiving updates.
#
# Repository secrets (Settings > Secrets and variables > Actions). The release
# minisign key, unchanged since earlier releases (the secret names are kept
# from then); cargo-packager reads it as CARGO_PACKAGER_SIGN_PRIVATE_KEY*:
#   TAURI_SIGNING_PRIVATE_KEY          - contents of the minisign private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - the password chosen at generate time
# Repository variables (same page, "Variables" tab; public values, baked into
# the binary at compile time). A repository secret of the same name works too;
# the variable wins when both are set:
#   RADAR_CLERK_FRONTEND_API - Clerk Frontend API URL (https://<instance>.clerk...)
#   RADAR_CLERK_CLIENT_ID    - the Clerk OAuth application's client id
# macOS builds are ad-hoc signed (radar-app/Cargo.toml) but not notarized until
# Apple Developer secrets are added: a downloaded copy's first launch needs
# System Settings > Privacy & Security > Open Anyway.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fails fast, before any draft or build, on a configuration that would
  # ship a broken release. Unset repository variables and secrets expand to
  # "", and the build would still succeed: without sign-in (option_env!
  # reads an empty Clerk config) or without update signatures. Only the
  # names of missing values are printed, never a value.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check release configuration
        env:
          RADAR_CLERK_FRONTEND_API: ${{ vars.RADAR_CLERK_FRONTEND_API || secrets.RADAR_CLERK_FRONTEND_API }}
          RADAR_CLERK_CLIENT_ID: ${{ vars.RADAR_CLERK_CLIENT_ID || secrets.RADAR_CLERK_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RADAR_CLERK_FRONTEND_API RADAR_CLERK_CLIENT_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          exit "$missing"

      # A tag that disagrees with the crate version would ship a build that
      # offers itself as an update forever.
      - name: Check tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG != Cargo.toml version v$version" >&2
            exit 1
          fi

  # Creates the draft once, so the matrix jobs only upload to it. Tags only;
  # a re-run finds the draft it made and reuses it.
  draft:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "Radar $TAG" \
              --notes "See the assets below to download."

  build:
    needs: draft
    # Runs after the draft, or without one on a dry run (draft skipped);
    # never after a failed check or draft.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            formats: app,dmg
          - platform: windows-latest
            formats: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # radar-app declares rust-version 1.99 (gpui-pre needs it).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true

      # The version the packaging config was written and tried against.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Package and sign
        env:
          # Compile-time client config (read with option_env! in radar-core).
          # Public values; the first came from the old .env.production.
          RADAR_SERVER_URL: https://radar-server-kjsc.onrender.com
          RADAR_CLERK_FRONTEND_API: ${{ vars.RADAR_CLERK_FRONTEND_API || secrets.RADAR_CLERK_FRONTEND_API }}
          RADAR_CLERK_CLIENT_ID: ${{ vars.RADAR_CLERK_CLIENT_ID || secrets.RADAR_CLERK_CLIENT_ID }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo packager -p radar-app --release --formats ${{ matrix.formats }}

      # Everything the packager wrote for this release: installers, the
      # `.app.tar.gz` updater archive, and the `.sig` files.
      - name: Upload artifacts to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(target/release/*-setup.exe target/release/*.dmg target/release/*.app.tar.gz target/release/*.sig)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "packager produced no artifacts" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      # Dry run: the same files, on the workflow run instead of a release.
      - name: Upload artifacts to the workflow run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/release/*-setup.exe
            target/release/*.dmg
            target/release/*.app.tar.gz
            target/release/*.sig

  # After every matrix job has uploaded: build `latest.json` from the signed
  # artifacts and flip the draft to published, so the updater-facing
  # `releases/latest/download/latest.json` URL resolves.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir artifacts
          gh release download "$TAG" --dir artifacts --pattern '*-setup.exe*' --pattern '*.app.tar.gz*'
          scripts/make-latest-json.sh "${TAG#v}" "$REPO" artifacts > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            });
            const draft = releases.find(r => r.tag_name === context.ref.replace('refs/tags/', ''));
            if (!draft) {
              core.setFailed(`no draft release found for ${context.ref}`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draft.id,
              draft: false,
            });
            core.info(`published release ${draft.tag_name}`);
